
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>টেস্ট ফর্ম</title>
</head>
<body>
  <h2>পরীক্ষামূলক তথ্য ফর্ম</h2>

  <form id="testForm">
    <label>কাল্পনিক নাম:</label><br>
    <input name="name" required><br><br>

    <label>পরীক্ষামূলক ইমেইল:</label><br>
    <input name="email" type="email" required><br><br>

    <button type="submit">তথ্য পাঠাও</button>
  </form>

  <p id="message"></p>

  <script>
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwcgC8c61Mo3jvQWtPid2OmMQrcqwJ4F6VuhEB3wzG5gzp3ELwiG4pADXFT2O__4_Wx/exec";

    document.getElementById("testForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const form = event.target;
        const data = new URLSearchParams(new FormData(form));

        document.getElementById("message").textContent =
          "তথ্য পাঠানোর চেষ্টা হচ্ছে...";

        try {
          await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            body: data
          });

          document.getElementById("message").textContent =
            "অনুরোধ পাঠানো হয়েছে। Google Sheet খুলে তথ্য এসেছে কি না যাচাই করো।";

          form.reset();
        } catch (error) {
          document.getElementById("message").textContent =
            "পাঠানো যায়নি। ইন্টারনেট ও Apps Script deployment যাচাই করো।";
        }
      });
  </script>
</body>
</html>
